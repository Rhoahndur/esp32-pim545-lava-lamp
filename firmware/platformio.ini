; PlatformIO project for the PIM545 (Pico Scroll Pack) lava lamp.
; Flash from this directory: `pio run -e esp32dev -t upload`
; Pick the env that matches your board.

[platformio]
src_dir = pim545_lava_lamp

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time, default

; Classic ESP32 DevKit V1 / WROOM (USB-C or micro-USB clones).
; I2C: GPIO21 = SDA, GPIO22 = SCL
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    -D PIM545_BOARD=1

; ESP32-S3 DevKitC / many USB-C S3 boards. Native USB serial.
; I2C: GPIO8 = SDA, GPIO9 = SCL
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -D PIM545_BOARD=2
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; ESP32-C3 SuperMini and similar tiny USB-C boards.
; I2C: GPIO8 = SDA, GPIO9 = SCL
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    -D PIM545_BOARD=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
