[platformio]
src_dir = .

[env:waveshare-touch-7]
; Arduino 3 / IDF 5 is required for RGB bounce_buffer_size_px (screen-drift fix).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_src_filter =
    +<touchscreen/>
    +<pim545_lava_lamp/lava_lamp.cpp>
    +<pim545_lava_lamp/ripple.cpp>
upload_protocol = esptool
upload_flags =
    --before=no_reset
    --after=no_reset
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D PIM545_BOARD=2
    -D LAVA_TOUCHSCREEN=1
lib_deps =
    moononournation/GFX Library for Arduino@1.5.6
