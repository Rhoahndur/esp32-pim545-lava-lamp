[platformio]
src_dir = touchscreen

[env:waveshare-touch-7]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D PIM545_BOARD=2
    -D LAVA_TOUCHSCREEN=1
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#45dc36beb61f67dfd33a19954a1227acb02cad25
